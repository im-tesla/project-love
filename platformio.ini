; Project Love -- BLE LED matrix gift
; ESP32-C3 Super Mini + MAX7219 8x32 red matrix, driven over BLE from Bluefy.
;
; Build firmware:  pio run -e esp32c3
; Flash:           pio run -e esp32c3 -t upload
; Serial monitor:  pio device monitor
; Host tests:      python tools/run_host_tests.py
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32
; If uploads misbehave on a generic "ESP32-C3 Super Mini" clone, the other
; board that reliably works for these is: esp32-c3-devkitm-1
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize
; ARDUINO_USB_* are not optional on this board: it has no USB-UART bridge, so
; without them the serial monitor stays silent and the board looks dead.
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CORE_DEBUG_LEVEL=0
	-std=gnu++17
build_unflags = -std=gnu++11
lib_deps =
	h2zero/NimBLE-Arduino @ ^2.2.3
	bblanchon/ArduinoJson @ ^7.2.1
	majicdesigns/MD_MAX72XX@^3.5.1

; Host-side unit tests.
;
; On Linux/macOS `pio test -e native` works directly. On Windows it does not:
; PlatformIO's native platform hardcodes env.Tool("gcc"), and the SCons it
; bundles has the MSVC support module stripped out, so a machine with Visual
; Studio but no MinGW cannot build here at all.
;
; Use `python tools/run_host_tests.py` instead -- it drives the MSVC that
; Visual Studio already provides and runs the same suites.
;
; Only hardware-free translation units are listed. These are the ones where a
; bug is silent rather than obvious: a mangled UTF-8 sequence or a dropped BLE
; chunk shows up as a subtly wrong message, not a crash.
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*> +<text_render.cpp> +<protocol.cpp> +<animations.cpp> +<state.cpp>
build_flags =
	-I src
	-std=gnu++17
	-D LOVE_NATIVE
lib_deps =
	bblanchon/ArduinoJson @ ^7.2.1
