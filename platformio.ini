; Project Love — BLE LED Matrix Gift
; ESP32-C3 Super Mini + MAX7219 8x32 red matrix, controlled over BLE from Bluefy.
;
; Two environments:
;   esp32c3   -> the real firmware
;   native    -> host-side unit tests for protocol/font code (no hardware needed)
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32c3

; ---------------------------------------------------------------------------
; Firmware
; ---------------------------------------------------------------------------
[env:esp32c3]
platform = espressif32
; If uploads misbehave on a generic "ESP32-C3 Super Mini" clone, the other
; board that reliably works for these is: esp32-c3-devkitm-1
board = lolin_c3_mini
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize

build_flags =
	; The C3 Super Mini has no USB-UART bridge — serial runs over native USB.
	; Without these two you get a silent monitor and think the board is dead.
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CORE_DEBUG_LEVEL=0
	-std=gnu++17
build_unflags = -std=gnu++11

lib_deps =
	h2zero/NimBLE-Arduino @ ^2.2.3
	majicdesigns/MD_Parola @ ^3.7.3
	majicdesigns/MD_MAX72XX @ ^3.5.1
	bblanchon/ArduinoJson @ ^7.2.1

; ---------------------------------------------------------------------------
; Host-side unit tests:  pio test -e native
;
; Only hardware-free translation units are compiled here. protocol.cpp is
; deliberately written against std::string/char buffers rather than Arduino
; String so it can be tested on the desktop.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity

; PlatformIO's native platform hardcodes gcc. On Windows this script swaps in
; the MSVC that Visual Studio already ships, so the host tests run without
; anyone installing MinGW. It also sets the C++17 flag per toolchain, which is
; why there is no -std= here.
extra_scripts = pre:tools/native_msvc.py

build_src_filter = -<*> +<protocol.cpp>
build_flags =
	-I src
	-D LOVE_NATIVE

lib_deps =
	bblanchon/ArduinoJson @ ^7.2.1
