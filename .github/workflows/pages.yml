name: Deploy web app to GitHub Pages
#
# Publishes web/ as-is -- no build step, because the site is plain ES modules
# and needs none. Runs on every push to master that touches web/, and can be
# triggered by hand from the Actions tab.
#
# One-time setup this workflow does NOT do: Settings -> Pages -> Build and
# deployment -> Source must be set to "GitHub Actions". Until that is set,
# the deploy step below fails with "Pages site not found".

on:
  push:
    branches: [master]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment in flight at a time; a second push while one is
# building should replace it, not queue behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
