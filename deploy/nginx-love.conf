# Project Love -- nginx site
#
#   sudo cp deploy/nginx-love.conf /etc/nginx/sites-available/love
#   sudo ln -s /etc/nginx/sites-available/love /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d milena.twojadomena.pl
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace milena.twojadomena.pl throughout, and point `root` at wherever you
# copied the web/ directory.
#
# ---------------------------------------------------------------------------
# The two things that break Web Bluetooth, both of which look like something
# else when they go wrong:
#
#   1. HTTPS is mandatory. navigator.bluetooth does not exist in an insecure
#      context, so over plain http:// the Połącz button reports "this browser
#      does not support Bluetooth" even in Bluefy. A self-signed certificate
#      will usually be rejected too -- this needs a real one.
#
#   2. Do NOT add a Permissions-Policy header that omits `bluetooth`. Sending
#      one silently disables the API with no console error worth reading. If
#      you have a global Permissions-Policy in nginx.conf, this site needs an
#      exception. The safe move is to send none at all, as below.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name milena.twojadomena.pl;

    # Leave this in place: certbot renews over port 80.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # The `http2` parameter here is the form that works on every nginx still
    # in common use, including Ubuntu 24.04 (1.24) and Ubuntu 22.04 (1.18).
    # On nginx 1.25.1+ it logs a deprecation warning; if yours is that new and
    # the warning bothers you, drop `http2` from these two lines and add a
    # separate `http2 on;` instead. Do not do both.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name milena.twojadomena.pl;

    # certbot fills these in and keeps them renewed.
    ssl_certificate     /etc/letsencrypt/live/milena.twojadomena.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/milena.twojadomena.pl/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/love/web;
    index index.html;

    charset utf-8;
    charset_types text/css application/javascript text/javascript application/json;

    # ES modules are served as a directory with no bundler, so the JavaScript
    # MIME type has to be right. Combined with nosniff below, a wrong type
    # makes Safari refuse the module and the page comes up blank.
    types {
        text/html                             html;
        text/css                              css;
        text/javascript                       js mjs;
        application/json                      json;
        image/svg+xml                         svg;
        font/woff2                            woff2;
        image/x-icon                          ico;
    }
    default_type application/octet-stream;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Deliberately no Permissions-Policy header -- see the note at the top.

    location = /index.html {
        # She keeps this bookmarked in Bluefy, so the shell must not go stale
        # when you deploy a change.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
        # Short enough that a fix reaches her phone the same evening, long
        # enough that reopening the page is instant.
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    gzip on;
    gzip_types text/css text/javascript application/javascript image/svg+xml;
    gzip_min_length 512;

    access_log /var/log/nginx/love.access.log;
    error_log  /var/log/nginx/love.error.log;
}
