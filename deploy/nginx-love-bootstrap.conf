# Bootstrap config -- port 80 only.
#
# Chicken and egg: nginx-love.conf points at certificate files that do not
# exist yet, so nginx will not start with it. This config serves plain HTTP
# just long enough for certbot to prove you own the domain, after which you
# replace it with the real one.
#
#   sudo cp deploy/nginx-love-bootstrap.conf /etc/nginx/sites-available/love
#   sudo ln -s /etc/nginx/sites-available/love /etc/nginx/sites-enabled/love
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/html -d milena.twojadomena.pl
#   sudo cp deploy/nginx-love.conf /etc/nginx/sites-available/love
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace milena.twojadomena.pl throughout.
#
# The site is deliberately usable over plain HTTP at this stage so you can
# confirm the files are being served before bringing TLS into it. It will not
# be able to talk to the matrix yet -- Web Bluetooth needs the certificate.

server {
    listen 80;
    listen [::]:80;
    server_name milena.twojadomena.pl;

    # certbot writes its challenge file here.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    root /srv/love/web;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }
}
