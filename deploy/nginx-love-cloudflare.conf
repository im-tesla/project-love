# Project Love -- nginx site, behind Cloudflare
#
# Use this one when Cloudflare proxies the domain (orange cloud). Cloudflare
# terminates TLS with its own certificate, so the browser sees real HTTPS and
# Web Bluetooth is satisfied. The origin serves plain HTTP and there is no
# certbot on this box at all.
#
#   sudo cp deploy/nginx-love-cloudflare.conf /etc/nginx/sites-available/love
#   sudo ln -s /etc/nginx/sites-available/love /etc/nginx/sites-enabled/love
#   sudo nginx -t && sudo systemctl reload nginx
#
# ---------------------------------------------------------------------------
# Do NOT add a redirect to https here.
#
# On Cloudflare's "Flexible" SSL mode the edge fetches from this origin over
# plain HTTP. A `return 301 https://...` would send the browser back to
# Cloudflare, which fetches over HTTP again, which redirects again -- an
# infinite loop, and the page never loads. Cloudflare is already serving the
# visitor over HTTPS; this server block has nothing to upgrade.
# ---------------------------------------------------------------------------
#
# Also check, in the Cloudflare dashboard for this domain:
#
#   Speed -> Optimization -> Rocket Loader        MUST BE OFF
#       Rocket Loader rewrites script tags and breaks `type="module"`.
#       The app is native ES modules, so it will not run with this on.
#
#   Caching -> Purge cache, after each deploy
#       Cloudflare caches .js and .css at the edge. index.html is sent
#       no-cache below and is not cached by default, but a changed module
#       can otherwise take a while to reach her phone.
#
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name milena.choosly.pl;

    root /srv/love/web;
    index index.html;

    charset utf-8;
    charset_types text/css application/javascript text/javascript application/json;

    # ES modules are served as a directory with no bundler, so the JavaScript
    # MIME type has to be right. Combined with nosniff below, a wrong type
    # makes Safari refuse the module and the page comes up blank.
    types {
        text/html                             html;
        text/css                              css;
        text/javascript                       js mjs;
        application/json                      json;
        image/svg+xml                         svg;
        font/woff2                            woff2;
        image/x-icon                          ico;
    }
    default_type application/octet-stream;

    # Deliberately no Permissions-Policy header: one that omits `bluetooth`
    # disables the API silently, with nothing useful in the console.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /index.html {
        # She keeps this bookmarked in Bluefy, so the shell must not go stale
        # when you deploy a change.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    gzip on;
    gzip_types text/css text/javascript application/javascript image/svg+xml;
    gzip_min_length 512;

    access_log /var/log/nginx/love.access.log;
    error_log  /var/log/nginx/love.error.log;
}
